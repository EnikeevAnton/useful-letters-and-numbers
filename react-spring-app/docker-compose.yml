version: '3.8'

services:
  frontend:
    build: ./react-frontend
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost/api/v1
    volumes:
      - ./react-frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./spring-backend
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
      - MYSQL_PORT=3306
    volumes:
      - ./spring-backend:/app
    depends_on:
      - db

  db:
    image: mysql:8.0
    env_file:
      - ./.env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data: 